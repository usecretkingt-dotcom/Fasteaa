<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fastea - Fresh Tea, Fast Delivery</title>
  <style>
    * {
      box-sizing: border-box;
      scroll-behavior: smooth;
    }
    body {
      font-family: "Poppins", "Segoe UI", sans-serif;
      margin: 0;
      background-color: #f8f6f2;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(90deg, #2e7d32, #388e3c);
      color: #fff;
      text-align: center;
      padding: 30px 10px;
      position: relative; /* Cart Link के लिए */
    }
    
    header h1 {
        margin-bottom: 5px;
    }

    nav {
      background: #2e7d32;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 14px 20px;
      transition: 0.3s;
    }
    nav a:hover {
        background: #1b5e20;
    }

    .cart-link-header {
      position: absolute;
      top: 30px;
      right: 20px;
      background: #ffb300;
      color: #000;
      padding: 10px 15px;
      border-radius: 8px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.3s;
    }
    .cart-link-header:hover {
        background: #ff9000;
    }
    .cart-count {
      background: red;
      color: white;
      padding: 2px 8px;
      border-radius: 50%;
      font-size: 0.9em;
      margin-left: 5px;
    }


    .hero {
      text-align: center;
      color: #fff;
      padding: 100px 20px;
      background: linear-gradient(rgba(46, 125, 50, 0.65), rgba(46, 125, 50, 0.65)),
        url("https://images.unsplash.com/photo-1465101162946-4377e57745c3?auto=format&fit=crop&w=1350&q=80")
          center/cover no-repeat;
    }
    .hero h1 {
        font-size: 2.5rem;
    }
   
    .products {
      padding: 70px 20px;
      text-align: center;
      background: #fff;
    }
    
    .products h2 {
        color: #2e7d32;
        margin-bottom: 40px;
        font-size: 2rem;
    }

    footer {
      background: #2e7d32;
      color: #fff;
      text-align: center;
      padding: 35px 10px;
      margin-top: 60px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Fastea</h1>
    <p>Fresh Tea, Fast Delivery</p>
    <a href="cart.html" class="cart-link-header">Cart 🛒<span class="cart-count" id="cartCount">0</span></a>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="cat.html">Shop</a>
    <a href="#">About Us</a>
    <a href="#">Contact</a>
  </nav>

  <section class="hero">
    <h1>Experience Tea Like Never Before</h1>
    <p>Handpicked blends delivered fast to your door</p>
    <a href="cat.html" style="display: inline-block; background: #ffb300; color: #000; padding: 12px 30px; text-decoration: none; font-weight: bold; border-radius: 6px; margin-top: 20px;">Shop Now</a>
  </section>

  <section class="products">
    <h2>Our Featured Teas</h2>
    <p>Click on 'Shop' to see our full collection!</p>
    </section>

  <footer>
    <div>Fastea © 2025 | All Rights Reserved</div>
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
        function updateCartCount() {
            // LocalStorage से कार्ट डेटा लेता है
            const cart = JSON.parse(localStorage.getItem("cart")) || [];
            // कार्ट में items की कुल संख्या दिखाता है
            const totalItems = cart.reduce((total, item) => total + item.quantity, 0);
            const cartCountElement = document.getElementById("cartCount");
            if (cartCountElement) {
                cartCountElement.textContent = totalItems;
            }
        }
        
        // पेज लोड होने पर कार्ट काउंट दिखाता है
        updateCartCount();
    });
  </script>
</body>
</html>
