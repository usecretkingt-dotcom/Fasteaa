<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fastea 🍃 Our Products</title>
  <style>
    body {
      font-family: "Poppins", "Segoe UI", sans-serif;
      margin: 0;
      background: #f7f6f2;
      color: #333;
      line-height: 1.6;
    }

    header {
      background: #1b5e20;
      color: #fff;
      text-align: center;
      padding: 20px 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header h1 {
      margin: 0;
      font-size: 1.8rem;
    }

    /* === NAVIGATION STYLES ADDED HERE === */
    nav {
      background: #2e7d32;
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      padding: 14px 20px;
      transition: 0.3s;
    }
    nav a:hover {
        background: #1b5e20;
    }
    /* ================================== */

    .cart-link {
      background: #ffb300;
      color: #000;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      margin-top: 10px;
      transition: 0.3s;
    }

    .cart-link:hover {
      background: #ff9000;
    }

    .cart-count {
      background: red;
      color: white;
      padding: 2px 8px;
      border-radius: 50%;
      font-size: 0.8em;
      vertical-align: top;
      margin-left: 5px;
    }

    h2 {
      text-align: center;
      margin-top: 30px;
      color: #1b5e20;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 24px;
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .product {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      text-align: center;
      padding-bottom: 0;
    }

    .product img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }
    
    .product-content {
        padding: 15px;
    }

    .product h3 {
      color: #1b5e20;
      margin-top: 10px;
      margin-bottom: 5px;
    }

    .product p {
      font-weight: 700;
      color: #2e7d32;
      margin-top: 0;
      margin-bottom: 15px;
    }

    .qty-select {
      margin-bottom: 10px;
      padding: 5px;
      font-size: 1em;
      border-radius: 6px;
      display: none; 
    }

    .product button {
      background: #2e7d32;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 0 0 12px 12px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s;
      width: 100%;
      margin-top: 10px;
    }

    .product button.in-cart {
      background: #ffb300; 
      color: #000;
    }

    .product button:hover {
      background: #1b5e20;
    }
    .product button.in-cart:hover {
      background: #ff9000;
    }


    footer {
      background: #1b5e20;
      color: #fff;
      text-align: center;
      padding: 10px 0;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Fastea 🍃 Fresh Tea, Fast Delivery</h1>
    <a href="cart.html" class="cart-link">Cart 🛒<span class="cart-count" id="cartCount">0</span></a>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="cat.html">Shop</a>
    <a href="#">About Us</a>
    <a href="#">Contact</a>
  </nav>
  <section id="staticProducts">
    <h2>Our Products</h2>
    <div class="product-grid">
        
      <div class="product">
        <img src="green tea.jpeg" alt="Premium Green Tea">
        <div class="product-content">
            <h3>Premium Green Tea</h3>
            <p>₹12.99</p>
            <select class="qty-select">
                <option value="1">Qty: 1</option>
            </select>
        </div>
        <button class="add-to-cart-btn" data-product-name="Premium Green Tea">Add to Cart</button>
      </div>

      <div class="product">
        <img src="black tea.jpeg" alt="Classic Black Tea">
        <div class="product-content">
            <h3>Classic Black Tea</h3>
            <p>₹10.99</p>
            <select class="qty-select">
                <option value="1">Qty: 1</option>
            </select>
        </div>
        <button class="add-to-cart-btn" data-product-name="Classic Black Tea">Add to Cart</button>
      </div>

      <div class="product">
        <img src="herbal tea.jpeg" alt="Herbal Bliss Tea">
        <div class="product-content">
            <h3>Herbal Bliss Tea</h3>
            <p>₹9.99</p>
            <select class="qty-select">
                <option value="1">Qty: 1</option>
            </select>
        </div>
        <button class="add-to-cart-btn" data-product-name="Herbal Bliss Tea">Add to Cart</button>
      </div>
        
    </div>
  </section>

  <footer>
    © 2025 Fastea | Made with ❤️ for Tea Lovers
  </footer>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      var cart = JSON.parse(localStorage.getItem("cart")) || [];

      function updateProductButton(name, buttonElement, quantity) {
          if (quantity > 0) {
              buttonElement.textContent = "Added: " + quantity + " unit(s) - Add More";
              buttonElement.classList.add('in-cart');
          } else {
              buttonElement.textContent = 'Add to Cart';
              buttonElement.classList.remove('in-cart');
          }
      }

      function updateCartCount() {
        var count = cart.reduce(function(sum, item) { return sum + item.quantity; }, 0); 
        document.getElementById("cartCount").textContent = count;
        
        document.querySelectorAll(".add-to-cart-btn").forEach(function(button) {
            var name = button.dataset.productName;
            var existing = cart.find(function(c) { return c.name === name; });
            var quantity = existing ? existing.quantity : 0;
            updateProductButton(name, button, quantity);
        });
      }

      function addToCart(productObj) {
        var qty = 1; 
        var existing = cart.find(function(c) { return c.name === productObj.name; });
        
        if (existing) {
            existing.quantity += qty; 
            console.log("Added 1 more unit of " + productObj.name + ". Total in cart: " + existing.quantity);
        } else {
            cart.push(Object.assign({}, productObj, { quantity: qty }));
            console.log(productObj.name + " added to cart.");
        }

        localStorage.setItem("cart", JSON.stringify(cart));
        updateCartCount();
      }

      document.querySelectorAll(".product").forEach(function(prod) {
        var name = prod.querySelector("h3").textContent.trim();
        var priceText = prod.querySelector("p").textContent.replace(/[^0-9.]/g, "");
        var price = parseFloat(priceText);
        var img = prod.querySelector("img").getAttribute('src'); 
        var button = prod.querySelector(".add-to-cart-btn");
        
        button.dataset.productName = name; 

        var productObj = { 
            "id": name.replace(/\s/g, ''),
            "name": name, 
            "price": price, 
            "img": img 
        }; 

        button.addEventListener("click", function() {
            addToCart(productObj); 
        });
      });

      updateCartCount();
    });
</script>
</body>
</html>
